<title>ゲムナビ</title>
<script>
  // Runs before the stylesheet below is applied, so the theme attribute is
  // already in place by the time CSS paints -- avoids a flash of the wrong
  // theme. Defaults to light regardless of the OS's prefers-color-scheme;
  // dark mode is opt-in only, via the menu toggle.
  (function () {
    try {
      var saved = localStorage.getItem("gemunavi-theme");
      document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho:wght@600;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --bg: #eef1ee;
    --surface: #ffffff;
    --ink: #16211f;
    --ink-soft: #5b6b64;
    --accent: #ff5a36;
    --accent-ink: #ffffff;
    --teal: #1f8f83;
    --teal-dark: #146b62;
    --line: #d7ddd7;
    --line-strong: #c3cbc3;
    --radius: 10px;
    /* Brand-title color only (site-logo/h1) -- a solid deep rust, not the
       same hue as --accent so the wordmark reads as its own thing rather
       than "the CTA button color, but text". Flat color on purpose: no
       gradient here. */
    --title-color: #a8391e;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171b1a;
      --surface: #202625;
      --ink: #eef1ee;
      --ink-soft: #9aa8a2;
      --accent: #ff7a5c;
      --accent-ink: #171b1a;
      --teal: #4fc7ba;
      --teal-dark: #8fe0d5;
      --line: #333c3a;
      --line-strong: #46514e;
      /* A dark rust would nearly vanish on a dark ground -- dark mode gets a
         warm, muted gold instead, still clearly its own color from --accent. */
      --title-color: #e0a95f;
    }
  }

  :root[data-theme="dark"] {
    --bg: #171b1a;
    --surface: #202625;
    --ink: #eef1ee;
    --ink-soft: #9aa8a2;
    --accent: #ff7a5c;
    --accent-ink: #171b1a;
    --teal: #4fc7ba;
    --teal-dark: #8fe0d5;
    --line: #333c3a;
    --line-strong: #46514e;
    --title-color: #e0a95f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    line-height: 1.75;
    min-height: 100vh;
  }
  ::selection { background: var(--accent); color: #fff; }
  [hidden] { display: none !important; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px 140px; }
  /* PC gets a genuinely different layout, not just a stretched phone view:
     a wider column so the results grid settles into 3 columns instead of 2,
     and a bit more side padding since the viewport has room to spare. */
  @media (min-width: 900px) {
    .wrap { max-width: 1120px; padding: 0 40px 140px; }
  }
  /* scroll-margin-top isn't inherited, so it has to sit on the elements
     themselves -- a broad rule here means any programmatic scroll (keyboard
     focus, browser find-in-page, this env's own automated testing) leaves
     room below the sticky nav + recap bars (~100px combined) instead of
     landing a target right underneath them where it'd be unreachable. */
  .wrap * { scroll-margin-top: 110px; }

  /* ---- Top brand bar: always visible, opaque (a sticky header should read
     as solid, never translucent, so it's never mistaken for scrolling
     content), minimal height. Logo doubles as a home link; the hamburger
     opens the page drawer (favorites / new & awards). Sits ABOVE the drawer
     and its scrim (z-index higher than both) so the hamburger button stays
     in the same clickable spot even while the drawer is open -- pressing it
     a second time closes the drawer instead of the button vanishing under
     the open panel. */
  .site-nav {
    position: sticky;
    top: 0;
    z-index: 80;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  /* Deliberately NOT centered/width-capped like .wrap below -- the hamburger
     and logo should sit in the actual top-left corner of the window on any
     screen size, not inset to wherever the centered content column happens
     to start. */
  .site-nav-inner {
    padding: 0 20px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
  }
  .site-logo {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    font-weight: 800;
    font-size: 1.05rem;
    text-decoration: none;
    letter-spacing: 0.06em;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    /* Flat --title-color instead of flat --ink black -- a solid color, not a
       gradient, so it reads as a deliberate brand color rather than a
       decorative effect. */
    color: var(--title-color);
  }
  .site-logo:hover { opacity: 0.78; }

  .nav-toggle {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: none;
    background: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0;
  }
  .nav-toggle span { display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 2px; }
  .nav-toggle:hover span { background: var(--accent); }

  .nav-scrim {
    position: fixed;
    top: 46px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(16, 20, 19, 0.35);
    z-index: 65;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .nav-scrim.open { opacity: 1; pointer-events: auto; }

  .nav-drawer {
    position: fixed;
    /* Starts below the site-nav bar (which sits above it, z-index-wise) so
       the two never overlap -- the drawer visually slides out from under
       the header instead of covering it. */
    top: 46px;
    left: 0;
    height: calc(100% - 46px);
    width: min(260px, 82vw);
    background: var(--surface);
    border-right: 1px solid var(--line);
    z-index: 70;
    padding: 24px 16px;
    transform: translateX(-100%);
    transition: transform 0.2s ease;
    box-shadow: 2px 0 20px rgba(22,33,31,0.18);
  }
  .nav-drawer.open { transform: translateX(0); }
  .nav-drawer h2 {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    margin: 4px 0 14px;
    color: var(--ink-soft);
  }
  .nav-link {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 12px 10px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.94rem;
    font-weight: 700;
    color: var(--ink);
    cursor: pointer;
    border-radius: 7px;
  }
  .nav-link:hover { background: var(--bg); }
  .nav-link.active { background: var(--teal); color: #ffffff; }
  /* Line icons (currentColor) instead of emoji -- they inherit the button's
     text color automatically, so the active/white state and dark mode both
     just work with no separate icon variants to keep in sync. */
  .nav-icon { width: 18px; height: 18px; flex-shrink: 0; }

  header.hero { padding-top: 38px; margin-bottom: 8px; }

  h1 {
    font-family: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 7.5vw, 3.4rem);
    margin: 0 0 14px;
    letter-spacing: 0.03em;
    /* Same flat --title-color as .site-logo -- a solid brand color, not a
       gradient/clip-text effect. */
    color: var(--title-color);
  }
  h1.hero-h1-icon { display: flex; align-items: center; gap: 14px; }
  h1.hero-h1-icon .hero-h1-svg { width: 0.72em; height: 0.72em; flex-shrink: 0; color: var(--accent); }
  /* A ch-based max-width badly underestimates full-width Japanese glyphs (ch
     is calibrated to a Latin '0'), so it wraps even with visible room to
     spare -- let it size naturally with clamp() instead. */
  .lede {
    font-size: clamp(0.86rem, 3.6vw, 1.02rem);
    color: var(--ink-soft);
    margin: 0;
  }

  /* ---- Tabs: underline indicator only -- a vertical divider between tabs
     was tried and looked wrong butting up against that underline, so tabs
     are separated by spacing alone. */
  .mode-toggle {
    display: flex;
    gap: 26px;
    border-bottom: 1.5px solid var(--line);
    margin: 28px 0 30px;
    padding: 0;
    background: none;
    border-radius: 0;
  }
  .mode-toggle button {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    padding: 0 0 12px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: none;
    border: none;
    border-radius: 0;
    position: relative;
    cursor: pointer;
  }
  .mode-toggle button.active { color: var(--ink); background: none; }
  .mode-toggle button.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1.5px;
    height: 2.5px;
    background: var(--accent);
    border-radius: 2px;
  }

  /* ---- Platform selector: Steam/PC is the only working mode today; the
     rest are a visual placeholder for future expansion (PS/Xbox/Switch/
     mobile). Tucked into a <details> below the main mode tabs (rather than
     given equal billing up top) since it's mostly "準備中" right now --
     collapsed by default, one line, opens to show the placeholder row. ---- */
  .platform-select {
    margin: 14px 0 0;
  }
  /* A plain small-text <summary> read as inert metadata, not a control you
     could tap -- a thin bordered pill (teal = "this is interactive" per the
     filter chips elsewhere) signals that without shouting; kept compact so
     it stays a minor, secondary control rather than competing with the tabs
     above it. */
  .platform-select summary {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--teal-dark);
    cursor: pointer;
    list-style: none;
    padding: 5px 11px;
    border: 1px solid var(--teal);
    border-radius: 999px;
    background: rgba(31,143,131,0.07);
    transition: background 0.15s ease;
  }
  .platform-select summary:hover { background: rgba(31,143,131,0.15); }
  .platform-select summary::-webkit-details-marker { display: none; }
  .platform-select summary::before {
    content: "▸";
    font-size: 0.62em;
    color: var(--teal);
    transition: transform 0.15s ease;
  }
  .platform-select[open] summary::before { transform: rotate(90deg); }
  .platform-select summary strong { color: var(--ink); font-weight: 700; }
  .platform-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
  .platform-tab {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.78rem; font-weight: 700;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .platform-tab.active {
    border-color: var(--teal);
    color: var(--teal-dark);
    background: rgba(31,143,131,0.14);
  }
  .platform-tab:disabled {
    cursor: not-allowed;
    opacity: 0.62;
  }
  .platform-tab .soon-badge {
    font-size: 0.62rem; font-weight: 700;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--line);
    color: var(--ink-soft);
    letter-spacing: 0.02em;
  }
  .platform-note {
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin: 8px 0 0;
  }

  .panel { padding: 0; scroll-margin-top: 110px; }
  .panel + .panel { margin-top: 0; }

  label.field-label {
    display: block;
    font-weight: 800;
    font-size: 0.98rem;
    color: var(--ink);
    margin-bottom: 12px;
  }

  textarea#chatInput {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 1rem;
    padding: 14px;
    border: 1.5px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
  }
  textarea#chatInput:focus, #searchInput:focus {
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }

  #searchInput {
    width: 100%;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 1rem;
    padding: 12px 14px;
    border: 1.5px solid var(--line-strong);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--ink);
  }

  /* ---- Search suggestions: a custom dropdown instead of a native
     <datalist> -- datalist's suggestion UI is inconsistent across browsers
     (iOS Safari in particular doesn't show one at all), so this matches the
     site's own visual language and works the same everywhere. */
  .search-input-wrap { position: relative; }
  .search-suggest {
    position: absolute;
    left: 0; right: 0;
    top: calc(100% + 6px);
    background: var(--surface);
    border: 1.5px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 12px 32px rgba(22,33,31,0.16);
    z-index: 30;
    max-height: 280px;
    overflow-y: auto;
    padding: 6px;
  }
  .search-suggest-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 7px;
    cursor: pointer;
  }
  .search-suggest-item:hover, .search-suggest-item.is-active { background: var(--bg); }
  .search-suggest-item-main { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex-wrap: wrap; }
  .search-suggest-item .title { font-size: 0.92rem; color: var(--ink); }
  .search-suggest-item .alias-of { font-size: 0.76rem; color: var(--ink-soft); white-space: nowrap; }
  /* A rough well-known/hidden-gem signal (see game.isMajor) rather than a
     silent popularity re-sort -- visible as a small badge instead of
     reordering results out from under the query match. */
  .tier-badge { font-size: 0.68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
  .tier-badge.major { background: rgba(31,143,131,0.14); color: var(--teal-dark); }
  .tier-badge.minor { background: rgba(91,107,100,0.14); color: var(--ink-soft); }

  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .example-btn {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.8rem;
    background: transparent;
    border: 1px dashed var(--line-strong);
    color: var(--ink-soft);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .example-btn:hover { border-color: var(--teal); color: var(--teal); }

  /* ---- Question blocks: separated by whitespace + a label/clear-button row
     per block only -- a hairline divider was tried here too and read the
     same way the tab dividers did (looked like it was "touching" the tags
     right below it), so blocks rely on spacing alone, same as the tabs. */
  /* Leaves room below the sticky nav + recap bars (~100px combined) so a
     programmatic scroll (keyboard focus, browser find-in-page) doesn't land
     a block right underneath them where it'd be unreachable/hidden. */
  .question-block { padding-top: 34px; scroll-margin-top: 110px; }
  .question-block:first-of-type { padding-top: 0; }

  .block-label-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .block-label-row .field-label { margin-bottom: 0; }

  .block-clear-btn {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--ink-soft);
    background: none;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    padding: 4px 0 4px 4px;
    opacity: 0.65;
    visibility: hidden;
    transition: opacity 0.15s ease;
  }
  .block-clear-btn.is-visible { visibility: visible; opacity: 0.65; }
  .block-clear-btn:hover { opacity: 1; color: var(--accent); text-decoration: underline; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; }

  /* Squared tags (not full pills): a resting shadow gives them slight
     physical depth instead of reading as flat wireframe outlines, and the
     selected state is a solid fill (same treatment as .filter-chip.active)
     rather than a faint tint, so "chosen" reads as a real, weighted state. */
  .chip-label {
    display: inline-block;
    padding: 8px 14px;
    border: 1.5px solid var(--line-strong);
    border-radius: 9px;
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--ink-soft);
    background: var(--surface);
    cursor: pointer;
    user-select: none;
    box-shadow: 0 1px 2px rgba(22,33,31,0.05);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
  }
  /* The checkbox itself (not the label) is the topmost element under the
     cursor -- see the .chip/.chip input comment above -- so the hover state
     has to key off the INPUT's :hover and style the adjacent label via the
     sibling combinator, the same way :focus-visible already does below.
     (.chip-label:hover on its own never matches, since the label never
     actually receives the pointer.) */
  .chip input:hover + .chip-label {
    border-color: var(--ink-soft);
    color: var(--ink);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(22,33,31,0.1);
  }
  .chip input:checked + .chip-label {
    border-color: var(--accent);
    color: var(--accent-ink);
    background: var(--accent);
    font-weight: 700;
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(255,90,54,0.32);
  }
  .chip input:checked:hover + .chip-label {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(255,90,54,0.4);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .chip input:checked + .chip-label,
    :root:not([data-theme="light"]) .chip input:checked:hover + .chip-label { box-shadow: 0 4px 14px rgba(255,122,92,0.3); }
  }
  :root[data-theme="dark"] .chip input:checked + .chip-label,
  :root[data-theme="dark"] .chip input:checked:hover + .chip-label { box-shadow: 0 4px 14px rgba(255,122,92,0.3); }
  .chip input:focus-visible + .chip-label { outline: 2px solid var(--teal); outline-offset: 1px; }

  /* ---- Genre: grouped into scannable clusters instead of one flat wall of
     15 tags -- grouping is the standard fix once a single-select/tag list
     passes ~10 options. */
  .genre-group { margin-bottom: 16px; }
  .genre-group:last-child { margin-bottom: 0; }
  .genre-group-label {
    font-size: 0.74rem;
    color: var(--ink-soft);
    opacity: 0.8;
    margin: 0 0 7px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .genre-group-label .swatch { width: 7px; height: 7px; border-radius: 2px; display: inline-block; flex-shrink: 0; }

  /* ---- Price slider: filled track up to the thumb, a thumb that grows
     while dragged/focused, and tick marks every ¥1,000 with a small "catch"
     pulse when crossed -- a native <input type=range> can't give real drag
     resistance, so this fakes the felt checkpoint with a visual cue. */
  .price-slider-row { display: flex; align-items: center; gap: 14px; }
  .price-track-wrap { position: relative; flex: 1; display: flex; align-items: center; }
  .price-ticks { position: absolute; left: 9px; right: 9px; top: 50%; height: 0; pointer-events: none; }
  .price-ticks .tick {
    position: absolute;
    top: 50%;
    width: 2px;
    height: 7px;
    background: rgba(22,33,31,0.2);
    border-radius: 1px;
    transform: translate(-50%, -50%);
  }
  input[type="range"] {
    position: relative;
    z-index: 1;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--line-strong);
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 2px 6px rgba(31,143,131,0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border: none;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 2px 6px rgba(31,143,131,0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  input[type="range"]:active::-webkit-slider-thumb,
  input[type="range"]:focus-visible::-webkit-slider-thumb { transform: scale(1.4); box-shadow: 0 4px 14px rgba(31,143,131,0.55); }
  input[type="range"]:active::-moz-range-thumb,
  input[type="range"]:focus-visible::-moz-range-thumb { transform: scale(1.4); box-shadow: 0 4px 14px rgba(31,143,131,0.55); }
  @keyframes snapPulse { 0% { transform: scale(1.4); } 50% { transform: scale(1.7); } 100% { transform: scale(1.4); } }
  input[type="range"].snap-pulse::-webkit-slider-thumb { animation: snapPulse 0.16s ease; }
  input[type="range"].snap-pulse::-moz-range-thumb { animation: snapPulse 0.16s ease; }
  .price-slider-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    color: var(--teal);
    font-weight: 700;
    white-space: nowrap;
    min-width: 6.5em;
    text-align: right;
  }

  .actions { margin-top: 26px; display: flex; align-items: center; gap: 14px; }

  button.primary {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 900;
    font-size: 0.96rem;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    padding: 13px 26px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  button.primary:hover { filter: brightness(1.06); }
  button.primary:active { transform: translateY(1px); }
  button.primary:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  .reset-link {
    background: none;
    border: none;
    color: var(--ink-soft);

  /* クリア floats to the immediate left of the pill via absolute positioning

  // Negation markers: a keyword hit near one of these (before or after) is treated
  // as something to AVOID rather than include, so "怖いのは苦手" excludes horror
  // instead of recommending it.
  var NEGATION_MARKERS = ["苦手","嫌い","嫌だ","NG","ng","なし","いらない","除く","抜きで","以外","じゃない","はちょっと","は避け","は避けたい","はいや","無理","ダメ","だめ","不要"];

  function isNegatedAt(lower, idx, wordLen) {
    var before = lower.substring(Math.max(0, idx - 10), idx);
    var after = lower.substring(idx + wordLen, idx + wordLen + 10);
    return NEGATION_MARKERS.some(function (mk) { return before.indexOf(mk) !== -1 || after.indexOf(mk) !== -1; });
  }

  function findMentionedGames(text) {
    var lower = text.toLowerCase();
    var found = [];
    SEARCH_INDEX.forEach(function (entry) {
      if (entry.str.length < 2) { return; }
      if (found.indexOf(entry.game) !== -1) { return; }
      if (lower.indexOf(entry.str.toLowerCase()) !== -1) { found.push(entry.game); }
    });
    return found;
  }

  function extractProfileFromText(text) {
    var lower = text.toLowerCase();
    var profile = { g: {}, p: {}, s: {}, d: {}, m: {} };
    var exclude = { g: {}, p: {}, s: {}, d: {}, m: {} };
    var matchedLabels = []; // [{field, value, weight}] in the order/strength found, for the echo line
    KEYWORDS.forEach(function (entry) {
      var words = entry[0], field = entry[1], value = entry[2], weight = entry[3];
      for (var i = 0; i < words.length; i++) {
        var w = words[i].toLowerCase();
        var idx = lower.indexOf(w);
        if (idx !== -1) {
          if (isNegatedAt(lower, idx, w.length)) {
            exclude[field][value] = true;
          } else {
            profile[field][value] = (profile[field][value] || 0) + weight;
            matchedLabels.push({ field: field, value: value, weight: weight });
          }
          break;
        }
      }
    });
    // "モンハンみたいなゲーム" / "RUSTみたいなの" -- recognize a named game in the
    // sentence and blend its own tags into the profile, same idea as search mode.
    var mentionedGames = findMentionedGames(text);
    mentionedGames.forEach(function (game) {
      ["g", "p", "s", "d", "m"].forEach(function (f) {
        (game[f] || []).forEach(function (v) { profile[f][v] = (profile[f][v] || 0) + 3; });
      });
    });
    // exclusion wins over inclusion if the same tag somehow ended up in both
    ["g", "p", "s", "d", "m"].forEach(function (f) {
      Object.keys(exclude[f]).forEach(function (v) { delete profile[f][v]; });
    });
    return { profile: profile, mentionedGames: mentionedGames, exclude: exclude, matchedLabels: matchedLabels };
  }

  // Builds a short natural-language-ish echo of what was understood from free text,
  // e.g. 「のんびり」×「協力向き」な感じ -- makes the chat feel more like a reply
  // than a plain "here are your search results" line, without any real AI behind it.
  function describeProfile(matchedLabels) {
    if (!matchedLabels || !matchedLabels.length) { return ""; }
    var sorted = matchedLabels.slice().sort(function (a, b) { return b.weight - a.weight; });
    var seen = {};
    var picked = [];
    for (var i = 0; i < sorted.length && picked.length < 3; i++) {
      var key = sorted[i].field + ":" + sorted[i].value;
      if (seen[key]) { continue; }
      seen[key] = true;
      picked.push(labelFor(sorted[i].field, sorted[i].value));
    }
    if (!picked.length) { return ""; }
    return "「" + picked.join("」×「") + "」な感じ";
  }

  function extractProfileFromQuiz() {
    // Matched by each checkbox's id prefix (g-/p-/s-/d-/m-), not by which
    // question-block visually contains it -- "配信・実況に向くゲームがいい"
    // still scores as a mood (m) tag even though it now lives in the
    // "こだわり" block alongside the GOTY hard-filter checkbox.
    var profile = { g: {}, p: {}, s: {}, d: {}, m: {} };
    ["g", "p", "s", "d", "m"].forEach(function (fieldKey) {
      document.querySelectorAll('#panelQuiz input[id^="' + fieldKey + '-"]:checked').forEach(function (input) {
        // Genre chips are broad categories (stage 1) that can stand in for
        // several underlying g[] tags at once -- e.g. checking "アクション"
        // should also match a game tagged only "moba" or "fighting". Every
        // other field is still a direct 1:1 checkbox-to-tag mapping.
        if (fieldKey === "g" && input.dataset.genres) {
          input.dataset.genres.split(",").forEach(function (gv) {
            profile.g[gv] = (profile.g[gv] || 0) + 3;
          });
        } else {
          profile[fieldKey][input.value] = (profile[fieldKey][input.value] || 0) + 3;
        }
      });
    });
    return profile;
  }

  var FIELDS = ["g", "p", "s", "d", "m"];

  function scoreGame(game, profile) {
    var score = 0;
    var reasons = [];
    FIELDS.forEach(function (field) {
      var gameValues = game[field] || [];
      Object.keys(profile[field]).forEach(function (val) {
        if (gameValues.indexOf(val) !== -1) {
          score += profile[field][val];
          reasons.push(labelFor(field, val));
        }
      });
    });
    return { score: score, reasons: reasons };
  }

  var LABELS = {
    g: {action:"アクション", rpg:"RPG", roguelike:"ローグライク", strategy:"戦略/シム", puzzle:"パズル", survival:"サバイバル", horror:"ホラー", shooter:"シューター", sim:"生活/経営シム", fighting:"対戦格闘", rhythm:"リズム", racing:"レース", moba:"MOBA", mmorpg:"MMORPG", card:"カード", vn:"ノベル", action_rpg:"アクションRPG", soulslike:"ソウルライク", metroidvania:"メトロイドヴァニア", hacknslash:"ハクスラ", roguelite:"ローグライト", survivorlike:"サバイバー", management:"経営", sandbox:"箱庭/サンドボックス", towerdefense:"タワーディフェンス", battleroyale:"バトルロイヤル"},
    p: {single:"一人向き", coop:"協力向き", pvp:"対戦向き"},
    s: {short:"短時間", medium:"ほどほど時間", long:"長時間じっくり"},
    d: {casual:"カジュアル", normal:"ほどよい歯応え", hardcore:"歯応え重視"},
    m: {cozy:"のんびり", story:"物語重視", emotional:"感動", dark:"ダーク", funny:"笑える", intense:"爽快", thinky:"頭を使う", beautiful:"世界観が良い", streamer:"配信・実況向き"}
  };
  function labelFor(field, val) { return (LABELS[field] && LABELS[field][val]) || val; }

  var PRICE_LABELS = { free: "無料", budget: "5,000円未満", premium: "5,000円以上" };
  function priceTagText(game) {
    if (game.pr === "free") { return "無料"; }
    if (game.priceYen != null) { return "¥" + game.priceYen.toLocaleString("ja-JP"); }
    return PRICE_LABELS[game.pr];
  }

  function profileFromGame(game) {
    var profile = { g: {}, p: {}, s: {}, d: {}, m: {} };
    ["g", "p", "s", "d", "m"].forEach(function (f) {
      (game[f] || []).forEach(function (v) { profile[f][v] = (profile[f][v] || 0) + 2; });
    });
    return profile;
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- Favorites (localStorage) ------------------------------------------
  var FAV_KEY = "gc_favorites_v1";
  var favorites = loadFavorites();
  function loadFavorites() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      return raw ? new Set(JSON.parse(raw)) : new Set();
    } catch (e) { return new Set(); }
  }
  function saveFavorites() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favorites))); } catch (e) { /* ignore */ }
  }
  function isFavorite(title) { return favorites.has(title); }
  function toggleFavorite(title) {
    if (favorites.has(title)) { favorites.delete(title); } else { favorites.add(title); }
    saveFavorites();
  }

  function buildCard(game, reasons, pct, rank) {
    var uniqueReasons = Array.from(new Set(reasons)).slice(0, 3);
    var tagsHtml = uniqueReasons.map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join("");
    var priceTag = '<span class="tag tag-price">' + priceTagText(game) + '</span>';
    var gotyTag = "";
    if (game.award && game.award.status === "winner") {
      gotyTag = '<span class="tag tag-goty">' + game.award.year + ' GOTY</span>';
    } else if (game.award && game.award.status === "nominee") {
      gotyTag = '<span class="tag tag-nominee">' + game.award.year + ' ノミネート</span>';
    }
    var rankHtml = rank != null ? '<span class="rank">' + rank + '</span>' : '';
    var favOn = isFavorite(game.t);
    var favHtml = '<button type="button" class="fav-star' + (favOn ? ' active' : '') +
      '" data-fav-title="' + escapeHtml(game.t) + '" aria-label="お気に入りに追加/解除">' +
      (favOn ? '★' : '☆') + '</button>';
    // Always try the real Steam header image. On claude.ai's Artifact hosting
    // it will fail to load (external images are blocked here) and onerror
    // just removes the <img>, leaving a plain neutral tile behind it. If this
    // same HTML is ever self-hosted elsewhere (a personal site, GitHub Pages,
    // or just opened as a local file) with no such restriction, the real
    // artwork loads normally with no code changes needed.
    var thumbImgHtml = game.appid
      ? '<img class="card-thumb-img" src="https://cdn.akamai.steamstatic.com/steam/apps/' + game.appid +
        '/header.jpg" alt="" loading="lazy" onerror="this.remove()">'
      : '';
    var thumbHtml = '<div class="card-thumb-wrap">' + thumbImgHtml + rankHtml + favHtml + '</div>';
    var steamHref = game.appid
      ? 'https://store.steampowered.com/app/' + game.appid
      : 'https://store.steampowered.com/search/?term=' + encodeURIComponent(game.t);
    var steamLabel = game.appid ? 'Steamで見る ↗' : 'Steamで探す ↗';
    var steamHtml = '<a class="steam-link" href="' + steamHref + '" target="_blank" rel="noopener noreferrer">' + steamLabel + '</a>';
    var reasonHtml = uniqueReasons.length
      ? '<p class="reason">' + escapeHtml(uniqueReasons.join(" / ")) + ' の条件に一致</p>'
      : '<p class="reason">&nbsp;</p>';
    var barHtml = pct != null
      ? '<div class="match-bar-track"><div class="match-bar-fill" style="width:' + pct + '%"></div></div>'
      : '';
    var card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      thumbHtml +
      '<h3>' + escapeHtml(game.t) + '</h3>' +
      '<p class="blurb">' + escapeHtml(game.b) + '</p>' +
      '<div class="tag-row">' + priceTag + gotyTag + tagsHtml + '</div>' +
      reasonHtml + barHtml + steamHtml;
    return card;
  }

  // ---- Shared state for the results + filter bar -----------------------
  var PRICE_SLIDER_MAX = 10000;
  var PAGE_SIZE = 6;
  var state = {
    pool: [],          // [{game, score, reasons}], score > 0, sorted desc
    pinned: null,       // exact-match game object for search mode, else null
    sourceLabel: "",
    emptyReason: null,  // "no-criteria" | "no-match" | null
    priceMax: PRICE_SLIDER_MAX, // upper price limit in yen; free titles always pass
    playerFilter: "all",
    genreFilter: "all",  // stage-2 fine-genre refine, applied on top of the pool
    visibleCount: PAGE_SIZE,
    sortMode: "relevance" // "relevance" | "price-asc" | "price-desc" | "popular"
  };

  var resultsEl = document.getElementById("results");
  var filterBar = document.getElementById("filterBar");

  function priceSliderLabelText(max) {
    return max >= PRICE_SLIDER_MAX ? "上限なし" : "¥" + max.toLocaleString("ja-JP") + " 以下";
  }

  function priceMatches(game) {
    if (game.pr === "free") { return true; } // free titles always shown regardless of the slider
    if (game.priceYen != null) { return game.priceYen <= state.priceMax; }
    // no live price data on record: it was defaulted to the "budget" bucket, so
    // treat it the same way unless the slider is pulled all the way down to 0.
    return state.priceMax > 0;
  }

  // Shared by both the quiz tab's own price question and the post-results
  // filter bar's price slider below: tick marks every ¥1,000 + a filled
  // track up to the thumb + a small "catch" pulse when a ¥1,000 mark is
  // crossed while dragging. A native <input type=range> can't give real
  // physical drag resistance, so this is a visual/behavioral stand-in for
  // that "kotsun" feeling.
  function setupPriceSlider(sliderEl, labelEl, ticksEl, onChange) {
    var min = parseInt(sliderEl.min, 10);
    var max = parseInt(sliderEl.max, 10);
    var lastWasCheckpoint = null;
    for (var t = 1000; t < max; t += 1000) {
      var tick = document.createElement("span");
      tick.className = "tick";
      var frac = (t - min) / (max - min);
      tick.style.left = "calc(9px + (100% - 18px) * " + frac + ")";
      ticksEl.appendChild(tick);
    }
    function apply(v) {
      labelEl.textContent = priceSliderLabelText(v);
      var pct = (v - min) / (max - min) * 100;
      sliderEl.style.background =
        "linear-gradient(to right, var(--teal) 0%, var(--teal) " + pct + "%, var(--line-strong) " + pct + "%, var(--line-strong) 100%)";
    }
    sliderEl.addEventListener("input", function () {
      var v = parseInt(sliderEl.value, 10);
      var isCheckpoint = (v % 1000 === 0);
      if (isCheckpoint && !lastWasCheckpoint) {
        sliderEl.classList.add("snap-pulse");
        setTimeout(function () { sliderEl.classList.remove("snap-pulse"); }, 160);
      }
      lastWasCheckpoint = isCheckpoint;
      apply(v);
      if (onChange) { onChange(v); }
    });
    apply(parseInt(sliderEl.value, 10));
    return { apply: apply };
  }

  // Quiz tab's own price question -- purely a display readout until submit,
  // when its value is carried into setPool() as the price filter for that
  // search.
  var quizPriceSlider = document.getElementById("quizPriceSlider");
  var quizPriceSliderLabel = document.getElementById("quizPriceSliderLabel");
  var quizPriceTicks = document.getElementById("quizPriceTicks");
  var quizPriceHandle = setupPriceSlider(quizPriceSlider, quizPriceSliderLabel, quizPriceTicks, function () {
    updateQuizLiveState();
  });

  // Post-results filter bar's own sort control -- re-order what's already
  // there (match strength, price, or popularity) on top of the pool as-is.
  var resultSortSelect = document.getElementById("resultSort");
  resultSortSelect.addEventListener("change", function () {
    state.sortMode = resultSortSelect.value;
    render(true);
  });

  // Results filter bar's own price slider -- the one place all three modes
  // (chat/quiz/search) can narrow or loosen the price cap after the fact.
  // For a quiz-originated pool it starts at whatever the quiz question was
  // set to (see setPool); chat/search never ask about price up front, so
  // theirs starts at "no limit".
  var resultPriceSlider = document.getElementById("resultPriceSlider");
  var resultPriceSliderLabel = document.getElementById("resultPriceSliderLabel");
  var resultPriceTicks = document.getElementById("resultPriceTicks");
  var resultPriceHandle = setupPriceSlider(resultPriceSlider, resultPriceSliderLabel, resultPriceTicks, function () {
    state.priceMax = parseInt(resultPriceSlider.value, 10);
    render(true);
  });

  function setPool(pool, sourceLabel, emptyReason, pinned, initialPriceMax) {
    var priceMaxToUse = (typeof initialPriceMax === "number" && !isNaN(initialPriceMax)) ? initialPriceMax : PRICE_SLIDER_MAX;
    state.pool = pool;
    state.sourceLabel = sourceLabel;
    state.emptyReason = emptyReason || null;
    state.pinned = pinned || null;
    state.priceMax = priceMaxToUse;
    state.playerFilter = "all";
    state.genreFilter = "all";
    state.visibleCount = PAGE_SIZE;
    state.sortMode = "relevance";
    resultSortSelect.value = "relevance";
    resultPriceSlider.value = priceMaxToUse;
    resultPriceHandle.apply(priceMaxToUse);
    document.querySelectorAll('.filter-chip').forEach(function (b) {
      b.classList.toggle("active", b.dataset.value === "all");
    });
    updateGenreChipVisibility();
    render();
  }

  // Stage-2 refine row shows only sub-genres that actually exist in the
  // current pool -- e.g. picking just "RPG" in the quiz means only
  // RPG-flavored chips (MMORPG/アクションRPG/ソウルライク/...) show up here,
  // not the full 26-chip list. Scoped to state.pool (before price/遊び方
  // narrows it further) so it reflects "what's available", not "what's
  // currently showing".
  function updateGenreChipVisibility() {
    var refineRow = document.querySelector('.chip-row-flat[data-filter="genre"]');
    if (!refineRow) { return; }
    var pool = state.pool || [];
    refineRow.querySelectorAll('.filter-chip').forEach(function (btn) {
      var val = btn.dataset.value;
      if (val === "all") { btn.hidden = false; return; }
      var hasMatch;
      if (val === "action_rpg") {
        hasMatch = pool.some(function (r) {
          var g = r.game.g || [];
          return g.indexOf("action") !== -1 && g.indexOf("rpg") !== -1;
        });
      } else {
        hasMatch = pool.some(function (r) { return (r.game.g || []).indexOf(val) !== -1; });
      }
      btn.hidden = !hasMatch;
    });
  }

  function render(keepScroll) {
    resultsEl.innerHTML = "";

    if (state.emptyReason === "no-criteria") {
      filterBar.hidden = true;
      resultsEl.innerHTML = '<div class="panel"><p class="empty-note">条件を読み取れなかった。ジャンル名や「のんびり」「対戦」「短時間」のような言葉を入れてみて、もしくは質問モードで選んでみてください。</p></div>';
      return;
    }
    if (state.emptyReason === "no-match") {
      filterBar.hidden = true;
      resultsEl.innerHTML = '<div class="panel"><p class="empty-note">近い条件のタイトルが見つからなかった。条件を少し減らすか、言葉を変えてもう一度試してみてください。</p></div>';
      return;
    }
    if (state.emptyReason === "no-title") {
      filterBar.hidden = true;
      resultsEl.innerHTML = '<div class="panel"><p class="empty-note">そのタイトルは見つからなかった。表記ゆれかもしれない、候補一覧から選ぶか、チャット/質問モードも試してみてください。</p></div>';
      return;
    }

    if (!state.pinned && state.pool.length === 0) { filterBar.hidden = true; return; }

    filterBar.hidden = state.pool.length === 0;

    var filtered = state.pool.filter(function (r) {
      var playerOk = state.playerFilter === "all" || (r.game.p || []).indexOf(state.playerFilter) !== -1;
      var genreOk;
      if (state.genreFilter === "all") {
        genreOk = true;
      } else if (state.genreFilter === "action_rpg") {
        // Derived/compound filter -- no stored tag, just "has both action and rpg".
        var gg = r.game.g || [];
        genreOk = gg.indexOf("action") !== -1 && gg.indexOf("rpg") !== -1;
      } else {
        genreOk = (r.game.g || []).indexOf(state.genreFilter) !== -1;
      }
      return priceMatches(r.game) && playerOk && genreOk;
    });

    // "relevance" leaves state.pool's own match-strength order alone; the
    // others re-sort on top of it. Array.prototype.sort is stable, so
    // "popular" still reads as "most popular first, ties broken by match
    // strength" rather than scrambling equally-popular results.
    if (state.sortMode === "price-asc") {
      filtered = filtered.slice().sort(function (a, b) { return priceSortValue(a.game) - priceSortValue(b.game); });
    } else if (state.sortMode === "price-desc") {
      filtered = filtered.slice().sort(function (a, b) { return priceSortValue(b.game) - priceSortValue(a.game); });
    } else if (state.sortMode === "popular") {
      filtered = filtered.slice().sort(function (a, b) { return (b.game.pop || 0) - (a.game.pop || 0); });
    }

    var shownCount = Math.min(filtered.length, state.visibleCount);

    var heading = document.createElement("div");
    heading.className = "results-heading";
    var countLabel = (state.pinned ? 1 : 0) + shownCount;
    var totalNote = filtered.length > shownCount ? '(全' + filtered.length + '本中)' : '';
    heading.innerHTML = '<h2>おすすめ ' + countLabel + '本' + totalNote + '</h2><span>' + escapeHtml(state.sourceLabel) + 'をもとに算出</span>';
    resultsEl.appendChild(heading);

    if (state.pool.length > 0 && filtered.length === 0) {
      resultsEl.innerHTML += '<p class="empty-note">絞り込み条件に合う候補がなかった。価格帯や遊び方の条件を緩めてみてください。</p>';
      if (!state.pinned) return;
    }

    var cards = document.createElement("div");
    cards.className = "cards";

    if (state.pinned) {
      var pinnedCard = buildCard(state.pinned, [], null, null);
      pinnedCard.classList.add("pinned");
      // .card-thumb-wrap relies on a negative margin to bleed to the card's
      // edges, which only cancels out correctly when it's the very first
      // flex child of .card -- inserting this label before it (afterbegin)
      // pushed the thumb down a slot while its negative top margin still
      // pulled it up by the same amount, so it rode up and overlapped the
      // label text. Inserting after the thumb instead keeps the thumb
      // first and the label in normal flow beneath it.
      var pinnedThumb = pinnedCard.querySelector(".card-thumb-wrap");
      var pinnedLabelHtml = '<span class="pinned-label">検索したタイトル</span>';
      if (pinnedThumb) { pinnedThumb.insertAdjacentHTML("afterend", pinnedLabelHtml); }
      else { pinnedCard.insertAdjacentHTML("afterbegin", pinnedLabelHtml); }
      cards.appendChild(pinnedCard);
    }

    var maxScore = filtered.length ? filtered[0].score : 1;
    filtered.slice(0, state.visibleCount).forEach(function (r, i) {
      var pct = Math.max(18, Math.round((r.score / maxScore) * 100));
      cards.appendChild(buildCard(r.game, r.reasons, pct, i + 1));
    });

    resultsEl.appendChild(cards);

    if (filtered.length > state.visibleCount) {
      var moreWrap = document.createElement("div");
      moreWrap.className = "load-more-wrap";
      moreWrap.innerHTML = '<button type="button" id="loadMoreBtn" class="load-more-btn">もっと見る(残り' +

        state.visibleCount += PAGE_SIZE;
        render(true);
      });
    }

    if (!keepScroll) {
      resultsEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function scorePool(profile, exclude, excludeTags) {
    var excludeList = Array.isArray(exclude) ? exclude : (exclude ? [exclude] : []);
    return GAMES.map(function (game) {
      var r = scoreGame(game, profile);
      return { game: game, score: r.score, reasons: r.reasons };
    }).filter(function (r) {
      if (r.score <= 0) { return false; }
      if (excludeList.indexOf(r.game) !== -1) { return false; }
      if (excludeTags) {
        for (var i = 0; i < FIELDS.length; i++) {
          var f = FIELDS[i];
          var bad = Object.keys(excludeTags[f] || {});
          if (!bad.length) { continue; }
          var vals = r.game[f] || [];
          for (var j = 0; j < bad.length; j++) {
            if (vals.indexOf(bad[j]) !== -1) { return false; }
          }
        }
      }
      return true;
    }).sort(function (a, b) { return b.score - a.score; });
  }

  // ---- Search mode -----------------------------------------------------------
  // Ranks by where the query appears (a match at the very start beats one
  // buried mid-string) and then by string length (a short, close alias
  // beats a long title that merely happens to contain the same letters
  // partway through -- e.g. querying "モンハン" would otherwise be able to
  // surface an unrelated long title like "...モンハンターズ" ahead of the
  // actual Monster Hunter entries).
  function rankedSearchMatches(query, limit) {
    var lower = query.trim().toLowerCase();
    if (!lower) return [];
    var candidates = [];
    SEARCH_INDEX.forEach(function (entry) {
      var idx = entry.str.toLowerCase().indexOf(lower);
      if (idx !== -1) { candidates.push({ entry: entry, idx: idx, len: entry.str.length }); }
    });
    candidates.sort(function (a, b) { return a.idx !== b.idx ? a.idx - b.idx : a.len - b.len; });
    var seenTitles = new Set();
    var out = [];
    for (var i = 0; i < candidates.length && (!limit || out.length < limit); i++) {
      var t = candidates[i].entry.game.t;
      if (seenTitles.has(t)) { continue; }
      seenTitles.add(t);
      out.push(candidates[i].entry);
    }
    return out;
  }

  function findGameByTitle(query) {
    var lower = query.trim().toLowerCase();
    if (!lower) return null;
    var exact = SEARCH_INDEX.find(function (e) { return e.str.toLowerCase() === lower; });
    if (exact) return exact.game;
    var ranked = rankedSearchMatches(query, 1);
    return ranked.length ? ranked[0].game : null;
  }

  function renderSuggestions(query) {
    if (!query.trim()) { hideSuggestions(); return; }
    var matches = rankedSearchMatches(query, 8);
    if (!matches.length) { hideSuggestions(); return; }
    suggestEntries = matches;
    suggestActiveIndex = -1;
    searchSuggestEl.innerHTML = "";
    matches.forEach(function (entry) {
      var item = document.createElement("div");
      item.className = "search-suggest-item";

      var main = document.createElement("span");
      main.className = "search-suggest-item-main";
      var titleSpan = document.createElement("span");
      titleSpan.className = "title";

      if (entry.str !== entry.game.t) {
        var aliasSpan = document.createElement("span");

        aliasSpan.textContent = entry.str;
        main.appendChild(aliasSpan);
      }
      item.appendChild(main);

      var badge = document.createElement("span");
      badge.className = "tier-badge " + (entry.game.isMajor ? "major" : "minor");
      badge.textContent = entry.game.isMajor ? "メジャー" : "マイナー";
      item.appendChild(badge);

      // mousedown (not click) fires before the input's blur would hide the
      // list, so tapping/clicking a suggestion always registers.
      item.addEventListener("mousedown", function (e) {
        e.preventDefault();
        selectSuggestion(entry);
      });
      searchSuggestEl.appendChild(item);
    });
    searchSuggestEl.hidden = false;
  }

  var SORT_OPTIONS = [["default", "追加順"], ["price-asc", "価格が安い順"], ["price-desc", "価格が高い順"]];
  function priceSortValue(game) {
    if (game.pr === "free") { return 0; }

  function sortGames(games, mode) {

  // dataset -- there's no release-date field to sort by, so "new" here means
  // titles confirmed as recent, well-known hits. The awards section is built
  // from each game's `award: {year, status}` field (set above in GAMES),
  // sourced against The Game Awards' actual Game of the Year winner AND
  // nominee lists per year -- not just winners, so a great game that lost to
  // an even bigger one still shows up.
  var RECENT_TITLES = ["Clair Obscur: Expedition 33", "Hades II", "Split Fiction", "Palworld", "Helldivers 2", "Balatro"];

  function buildCardsGrid(games) {
    var cards = document.createElement("div");
    cards.className = "cards";
    games.forEach(function (game) { cards.appendChild(buildCard(game, [], null, null)); });
    return cards;
  }

  // A section with a "並び替え" control -- re-sorting just rebuilds the
  // cards grid in place, it doesn't touch the heading or re-fetch anything.
  function renderSortableSection(container, titleText, games, countSuffix) {
    if (!games.length) { return; }
    var section = document.createElement("section");
    var heading = document.createElement("div");
    heading.className = "results-heading";
    var titleWrap = document.createElement("div");
    titleWrap.innerHTML = "<h2>" + escapeHtml(titleText) + "</h2>";
    heading.appendChild(titleWrap);

    var right = document.createElement("div");
    right.className = "results-heading-right";
    if (countSuffix) {
      var countSpan = document.createElement("span");
      countSpan.textContent = countSuffix;
      right.appendChild(countSpan);
    }
    var sortSelect = document.createElement("select");
    sortSelect.className = "sort-select";
    sortSelect.setAttribute("aria-label", titleText + "の並び替え");
    SORT_OPTIONS.forEach(function (pair) {
      var opt = document.createElement("option");
      opt.value = pair[0];
      opt.textContent = pair[1];
      sortSelect.appendChild(opt);
    });
    right.appendChild(sortSelect);
    heading.appendChild(right);
    section.appendChild(heading);

    var cardsWrap = buildCardsGrid(games);
    section.appendChild(cardsWrap);
    sortSelect.addEventListener("change", function () {
      var fresh = buildCardsGrid(sortGames(games, sortSelect.value));
      section.replaceChild(fresh, cardsWrap);
      cardsWrap = fresh;
    });

    container.appendChild(section);
  }

  function renderNewAndAwards() {
    newResultsEl.innerHTML = "";
    var recent = RECENT_TITLES.map(function (t) { return GAMES.find(function (g) { return g.t === t; }); }).filter(Boolean);
    renderSortableSection(newResultsEl, "最近話題の新作", recent, recent.length + "本");

    var awarded = GAMES.filter(function (g) { return g.award != null; });
    var years = Array.from(new Set(awarded.map(function (g) { return g.award.year; }))).sort(function (a, b) { return b - a; });
    if (years.length) {
      var awardsHeading = document.createElement("h2");
      awardsHeading.className = "awards-year-title";
      awardsHeading.textContent = "受賞歴(The Game Awards Game of the Year)";
      newResultsEl.appendChild(awardsHeading);
      years.forEach(function (year, idx) {
        var inYear = awarded.filter(function (g) { return g.award.year === year; })
          .sort(function (a, b) { return a.award.status === b.award.status ? 0 : (a.award.status === "winner" ? -1 : 1); });
        var winnerCount = inYear.filter(function (g) { return g.award.status === "winner"; }).length;
        var nomineeCount = inYear.length - winnerCount;
        var parts = [];
        if (winnerCount) { parts.push("受賞" + winnerCount + "本"); }
        if (nomineeCount) { parts.push("ノミネート" + nomineeCount + "本"); }

        // Accordion per year -- collapsed by default, except the most
        // recent year (idx 0), which opens so the page isn't a wall of
        // closed bars on first visit.
        var details = document.createElement("details");
        details.className = "award-year";
        if (idx === 0) { details.open = true; }
        var summary = document.createElement("summary");
        summary.innerHTML =
          '<span class="award-year-label"><span class="award-year-num">' + year + '年</span>' +
          '<span class="award-year-count">' + escapeHtml(parts.join(" + ")) + '</span></span>' +
          '<span class="award-year-chevron">▼</span>';
        details.appendChild(summary);
        details.appendChild(buildCardsGrid(inYear));
        newResultsEl.appendChild(details);
      });
    }
  }
})();
</script>
